<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>LeftRight</title>
</head>

<style>
    #container {
        width: 400px;
        height: 400px;
        position: relative;
        background: green;
    }
    #animate {
        width: 50px;
        height: 50px;
        position: absolute;
        background-color: red;
    }
</style>
<body>

<p><button onclick="myMove()">Click Me</button></p>

<div id ="container">
    <div id ="animate"></div>
</div>

<script>

    // Aufgabe: das rote Quadrat soll nur von links nach rechts wandern
    function myMove() {
        let id = null;
        const elem = document.querySelector("#animate");
        let pos = 0;
        clearInterval(id);
        id = setInterval(frame, 5);
        function frame() {
            if (pos == 350) {
                clearInterval(id);
            } else {
                pos++;
                elem.style.left = pos + "px";
            }
        }
    }
</script>

</body>
</html>

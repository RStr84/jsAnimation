<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snake</title>
</head>

<style>
    #container {
        width: 400px;
        height: 400px;
        position: relative;
        background: green;
    }

    #animate {
        width: 50px;
        height: 50px;
        position: absolute;
        background-color: red;
    }
</style>

<body>

<p>
    <button onclick="myMoveK()">Click Me</button>
</p>

<div id="container">
    <div id="animate"></div>
</div>

<script>

    // Aufgabe: das rote Quadrat soll sich durchs Div schlängeln

    // Kurzform //
    function myMoveK() {
        let id = null;
        const elem = document.querySelector("#animate");
        let xpos = 0;   // Abstand links
        let ypos = 0;   // Abstand top
        clearInterval(id);
        id = setInterval(frame, 5);

        const moveRight = function () {
            xpos++;
            elem.style.left = xpos + 'px';
        }

        const moveDown = function () {
            ypos++;
            elem.style.top = ypos + 'px';
        }

        const moveLeft = function () {
            xpos--;
            elem.style.left = xpos + 'px';
        }

        function frame() {
            if (xpos === 0 && ypos === 350) {
                clearInterval(id);
            } else {
                if (xpos < 350 && ypos === 0) {
                    moveRight();

                } else if (xpos === 350 && ypos < 50) {
                    moveDown();

                } else if (xpos > 0 && ypos === 50) {
                    moveLeft();

                } else if (xpos === 0 && ypos < 100) {
                    moveDown();

                } else if (xpos < 350 && ypos === 100) {
                    moveRight();

                } else if (xpos === 350 && ypos < 150) {
                    moveDown();

                } else if (xpos > 0 && ypos === 150) {
                    moveLeft();

                } else if (xpos === 0 && ypos < 200) {
                    moveDown();

                } else if (xpos < 350 && ypos === 200) {
                    moveRight();

                } else if (xpos === 350 && ypos < 250) {
                    moveDown();

                } else if (xpos > 0 && ypos === 250) {
                    moveLeft();

                } else if (xpos === 0 && ypos < 300) {
                    moveDown();

                } else if (xpos < 350 && ypos === 300) {
                    moveRight();

                } else if (xpos === 350 && ypos < 350) {
                    moveDown();

                } else if (xpos > 0 && ypos === 350) {
                    moveLeft();

                } else
                    clearInterval(id);
            }
        }
    }
